{% extends 'base.html' %}

{% block head %}
	<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}

{% block title %}Dashboard{% endblock %}

{% block body %}
<div class="w-full min-h-screen flex items-center justify-center p-4">
 	<div class="w-full max-w-2xl">
 		<div class="text-center mb-12">
 			<h1 class="text-4xl md:text-6xl font-bold bg-gradient-to-r from-blue-400 via-blue-500 to-purple-500 bg-clip-text text-transparent mb-2">Mass Mailer</h1>
 			<p class="text-gray-400 text-sm md:text-base">Send emails in bulk with ease</p>
 		</div>

 		<div class="bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-700">
 			<form class="flex flex-col gap-6">
				<div class="space-y-2">
					<label class="text-sm font-semibold text-gray-300 block">Recipients</label>
					<div class="bg-gray-900 rounded-lg border-2 border-gray-700 hover:border-gray-600 focus-within:border-blue-500 focus-within:shadow-lg focus-within:shadow-blue-500/20 transition-all duration-200">
						<div class="p-3 flex flex-wrap items-center gap-2 min-h-[3.5rem]">
							<div id="target-emails-container" class="flex flex-wrap items-center gap-2"></div>
							<input id="target-emails-input" class="flex-1 bg-transparent outline-none text-gray-200 placeholder-gray-600 py-1 px-2 min-w-[150px] sm:min-w-[200px] text-sm" placeholder="Enter email and press Enter" />
						</div>
					</div>
					<p class="text-xs text-gray-500">Press Enter or comma to add emails</p>
				</div>

 				<div class="space-y-2">
					<label class="text-sm font-semibold text-gray-300 block">Subject</label>
 					<input id="email-subject" class="w-full px-4 py-3 bg-gray-900 border-2 border-gray-700 hover:border-gray-600 focus:border-blue-500 focus:shadow-lg focus:shadow-blue-500/20 text-gray-200 placeholder-gray-600 outline-none transition-all duration-200 rounded-lg text-sm" placeholder="Email subject..." />
				</div>

				<select id="email-template-select" class="w-full px-4 py-3 bg-gray-900 border-2 border-gray-700 hover:border-gray-600 focus:border-blue-500 focus:shadow-lg focus:shadow-blue-500/20 text-gray-200 placeholder-gray-600 outline-none transition-all duration-200 rounded-lg text-sm">
					<option value="">Send html template</option>
					<option value="default">Send normal message</option>
				</select>

 				<div class="space-y-2">
					<label class="text-sm font-semibold text-gray-300 block">Message</label>
 					<textarea id="email-body" class="w-full px-4 py-3 bg-gray-900 border-2 border-gray-700 hover:border-gray-600 focus:border-blue-500 focus:shadow-lg focus:shadow-blue-500/20 text-gray-200 placeholder-gray-600 outline-none transition-all duration-200 rounded-lg text-sm resize-none h-40" placeholder="Email message..."></textarea>
				</div>

 				<button id="send-emails-btn" class="w-full md:w-auto px-8 py-3 mt-2 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/50 transition-all duration-200 transform hover:scale-105 active:scale-95">Send Emails</button>
 			</form>
 		</div>
 	</div>
</div>
{% endblock %}
